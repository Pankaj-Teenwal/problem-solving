<script>
    const maxPower = function (s) {
        let obj = {}

        for (let i = 1; i < s.length; i++) {
            if (s[i] == s[i - 1]) {
                if (obj.hasOwnProperty(s[i])) {
                    obj[s[i]] = obj[s[i]] + 1
                }
                else {
                    obj[s[i]] = 1
                }
            }

        }
        console.log(obj)
    };

    let s = "abbcccddddeeeeedcba";

    maxPower(s)

</script>
