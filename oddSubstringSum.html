<script>

    let arr = [1,4,2,5,3]

    const findOddSubstringSum = (arr)=>{
        let resultArray = []
        for(let i=0; i<arr.length;i++){
            if(i=0){
                resultArray = [...resultArray,...arr]
            }

            if(i+1 %2 !=0){
                for(let j=0; j<i;j++){
                    resultArray.push(arr[j])
                }
            }
        }

        console.log("result array",resultArray)
    }

    findOddSubstringSum(arr)
</script>
